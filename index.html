<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#a855f7" />

    <!-- RougeChain brand fonts: Inter (UI) + JetBrains Mono (mono/code). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Bebas+Neue&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="RouGee — a decentralized, un-deplatformable photo network on RougeChain. No shadowbans. No disabled accounts. Just your keys and your pictures."
    />

    <!-- Social share (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RouGee" />
    <meta property="og:title" content="RouGee — an un-deplatformable photo network" />
    <meta
      property="og:description"
      content="A decentralized photo network on RougeChain. No shadowbans, no disabled accounts — just your keys and your pictures."
    />
    <meta property="og:url" content="https://rougee.app" />
    <meta property="og:image" content="https://rougee.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RouGee — your keys, your photos, un-deplatformable." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RouGee — an un-deplatformable photo network" />
    <meta
      name="twitter:description"
      content="A decentralized photo network on RougeChain. Your keys, your photos."
    />
    <meta name="twitter:image" content="https://rougee.app/og-image.png" />

    <!-- Installable PWA: "Add to Home Screen" launches fullscreen, no browser chrome. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="RouGee" />

    <title>RouGee</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
