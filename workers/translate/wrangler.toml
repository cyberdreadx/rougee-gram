# Cloudflare Worker: RouGee translation (Workers AI).
#
# Translates a post's caption/text into the viewer's language on demand. Uses
# an instruct model (auto-detects the source language) and caches each result
# in KV by (target, text-hash) with a 30-day TTL, so a popular post is only
# ever translated once — repeat views are free KV reads.
#
# Setup:
#   npx wrangler kv namespace create TRANSLATE
#     -> put the returned id below under [[kv_namespaces]]
#   npx wrangler deploy --config workers/translate/wrangler.toml
#   # then set VITE_TRANSLATE_WORKER_URL to the deployed URL (netlify.toml / .env).
name = "rougee-translate"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "TRANSLATE"
id = "22983cd328994acca83fe7b27f84a8f0"

[vars]
ALLOW_ORIGIN = "*"
