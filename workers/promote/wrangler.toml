# Cloudflare Worker: RouGee promote — watch-to-earn ad engine.
#
# Advertisers pay XRGE to the ad-pool wallet to boost a post; most of it funds a
# reward pool that pays eligible viewers a micro-reward per view (accrued, paid on
# claim). Payment + eligibility are verified on-chain. See workers/promote/src.
#
# Setup:
#   npx wrangler kv namespace create PROMOTE   -> put id below
#   # Generate an ad-pool wallet, then:
#   npx wrangler secret put POOL_MNEMONIC --config workers/promote/wrangler.toml
#   npx wrangler deploy --config workers/promote/wrangler.toml
#   # GET /pool -> the ad-pool address advertisers pay to (set VITE_PROMOTE_* / UI)
#   # Fund the pool wallet enough to cover payout fees.
name = "rougee-promote"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "PROMOTE"
id = "37c569bfacbf4b059b35976272730397"

[vars]
NODE_TESTNET = "https://testnet.rougechain.io/api"
NODE_MAINNET = "https://api.rougechain.io/api"
ALLOW_ORIGIN = "*"
# XRGE a viewer earns per sponsored-post view.
REWARD_PER_VIEW = "0.5"
# A viewer must hold at least this much XRGE to earn (Sybil defense).
EARN_MIN_XRGE = "100"
# Minimum accrued XRGE before a viewer can claim (batches payout fees).
CLAIM_MIN_XRGE = "10"
# Fraction of ad spend that funds the viewer pool; the rest is RouGee's cut.
VIEWER_POOL_PCT = "0.85"
