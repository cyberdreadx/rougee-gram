# Netlify deployment config for rougee-gram (Vite + React SPA).
# When you connect the repo in Netlify, these settings are auto-detected
# from this file, so you don't need to fill in the build UI manually.

[build]
  # Runs `tsc && vite build` (see package.json). Outputs static assets to dist/.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Repo requires Node 18+ (Vite 5, @types/node 20). Pin to 20 LTS so builds
  # are reproducible and don't break when Netlify changes its default Node.
  NODE_VERSION = "20"

  # Shared Cloudflare R2 media backend (Worker in workers/media). This is the
  # public Worker URL, not a secret, so it's safe to commit here — every visitor's
  # uploads go to the same bucket and are visible to everyone. Media refs are
  # stored domain-agnostically (cf:<key>, see src/lib/media/cloudflare.ts), so to
  # move the CDN to a custom domain later (e.g. cdn.rougee.xyz) just change this
  # one value and redeploy — existing on-chain media follows automatically.
  VITE_CF_WORKER_URL = "https://rougee-gram-media.rougee.workers.dev"

  # Route video/reels through Cloudflare Stream (adaptive HLS) instead of raw R2
  # MP4. Stream transcodes any upload — incl. iOS HEVC/H.265/.mov — to H.264 HLS
  # that plays cross-browser. Requires CF_ACCOUNT_ID + CF_STREAM_TOKEN worker
  # secrets (set) and Stream enabled on the account.
  VITE_CF_STREAM = "true"

# Never cache the HTML entry, so a new deploy is picked up on the next load
# instead of a stale index.html pointing at an old (or purged) JS bundle — the
# classic cause of a post-deploy white screen. Fingerprinted assets (Vite puts a
# content hash in each filename) are immutable and cache forever.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA catch-all. rougee-gram uses react-router BrowserRouter with routes like
# /p/:postId, /u/:address, /settings and /explore. Without this rule, a direct
# visit or hard refresh of one of those paths is a request for a file that does
# not exist in dist/, and Netlify returns a 404. Serving index.html with a 200
# lets the client-side router resolve the route. Keep this LAST.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
